aid: launchmetrics
name: Launchmetrics
description: 'Launchmetrics is the Brand Performance Cloud for the fashion, luxury and beauty (FLB)
  industries, formed from Fashion GPS and Augure and headquartered in Paris and New York. Its SaaS
  platform bundles Discover (PR and social media monitoring), Insights (brand performance benchmarking
  and Media Impact Value), Samples (product sample tracking and logistics), Events (event, RSVP and
  seating management), Contacts (contact and mailing management) and Spotlight (visual asset galleries).
  Launchmetrics publishes a small, public REST API reference at nap.launchmetrics.com/docs covering five
  services — Search, Documents, Documents v2, Medias and Auditlogs — that expose the publication,
  media-outlet and audit-log data behind Discover and Insights. Requests are authenticated with an
  app_id issued by Launchmetrics R&D, optionally strengthened with an HMAC-SHA1 request signature. A
  separate Events API is marketed as a CRM connector but is sales-gated with no public reference.'
