note: >-
  Launchmetrics publishes no dated changelog or release-notes page for its APIs. The NAP reference at
  nap.launchmetrics.com/docs is undated static HTML with no "what's new", no version history and no
  per-service revision log; the only change signal in it is the inline sentence deprecating the appId
  / appid parameter in favour of app_id, which carries no date.
  The company does run a product-news section for its SaaS modules at
  www.launchmetrics.com/resources/product-news, but (a) it covers product releases rather than API
  changes, and (b) it could not be read on this pass — the marketing host is behind a SiteGround bot
  challenge for our egress IP and returns HTTP 202 with a captcha stub on every path, including that
  section and every RSS path tried.
  Recorded as an honest zero: no dated API changelog was found anywhere reachable.
