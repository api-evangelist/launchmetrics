entities:
- name: document
  description: >-
    A publication — an article, post, video or other indexed piece of coverage. The central entity of
    the Launchmetrics data model and the unit returned by both Search and Documents.
  identifier: numeric string id (example ids are 20-digit values such as 14973462950408689474)
  retrieved_by:
  - GET /documents/{ids} (Documents v1, Documents v2)
  - GET|POST /documents (Search)
  observed_fields:
  - provider
  - date
  - content
  - title
  - summary
  - link
  - url
  - image
  - original_image
  - video_url
  - language
  - country_code
  - location
  - place
  - coords
  - keywords
  - type_publication
  - id_from_provider
  - date_from_provider
  - feeling
  - cluster
  - social
  - author
  - influencer_ids
  representations:
    parameter: response_type
    known_values:
    - analytics
    note: >-
      The reference demonstrates response_type=analytics, which returns a flattened analytics-shaped
      document. Other accepted values are referenced but not enumerated in the docs.
- name: author
  description: >-
    The account or byline behind a document. Embedded inside document rather than addressable on its
    own endpoint.
  observed_fields:
  - id
  - name
  - url
  - age
  - contact_count
  - subscriber_count
  - subscription_count
  - video_watch_count
  - favourites_count
  - tweets_count
- name: social_metrics
  description: Engagement counters attached to a document.
  observed_fields:
  - likes
  - shares
  - replies
  - retweet_to_user
  - user_mentions
- name: media
  description: >-
    A media outlet — the publication vehicle rather than the piece of coverage. Split into online and
    print corpora with separate search endpoints.
  identifier: media id
  retrieved_by:
  - GET /medias/{ids}
  - GET /medias/search
  - GET /medias/print/search
- name: influencer
  description: >-
    An influencer profile. Referenced from document via influencer_ids, and the Search API's
    /search/v1/influencers endpoint is named in the Documents overview as the source whose results are
    served from an Amazon-backed cache. The influencers endpoint itself is not separately documented.
  identifier: influencer id
- name: audit_log
  description: An audit record scoped to a team, a group and an object.
  identifier: composite (team, group, id)
  retrieved_by:
  - GET /auditlogs/{team}{group}{id}
- name: facet
  description: >-
    An aggregation bucket over a document search — counts by channel type, topic path, language,
    country or key phrase. Returned by /documents/facets, not independently addressable.
