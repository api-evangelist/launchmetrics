method: searched
source: https://nap.launchmetrics.com/docs
format: proprietary
note: >-
  Launchmetrics does not use RFC 9457 application/problem+json. Every NAP service returns a wrapped
  JSON envelope whose error member carries a machine-readable code and a human message. The generic
  codes below are published on the "Generic Error codes" section of every service page; the remainder
  were observed live on 2026-08-17 against nap.launchmetrics.com and api-ter.launchmetrics.com, with
  the status returned recorded verbatim. Each service page also carries a "Custom error codes" heading,
  but Launchmetrics has left those sections empty in the published reference — a real documentation
  gap, not an absence of custom codes.
envelope:
  content_type: application/json; charset=utf-8
  fields:
    status: HTTP status repeated in the body
    time: server-side processing time in seconds
    request: echo of the method, path and parameters
    error.code: machine-readable error code
    error.message: human-readable message
