  provider: Instatus
  public: false
  http_status: 200
  final_url: https://status.launchmetrics.com/login
  probed: '2026-08-17'
  note: >-
    Launchmetrics operates a status page on its own subdomain (CNAME cname.instatus.com), but it is a
    private Instatus page: an anonymous GET returns 200 and lands on /login. Incident history is
    therefore visible to signed-in customers only, not to the public or to an agent.
health_endpoints:
