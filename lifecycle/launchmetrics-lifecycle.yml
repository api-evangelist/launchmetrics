versioning:
  scheme: uri-path
  detail: >-
    Every NAP service embeds a /v[:version] segment. The reference states v0 is the testing
    environment (authentication disabled, and disabled in production) and v1 is the authenticated
    production version. Documents runs v1 and v2 side by side on separate base paths, which is the
    only observed multi-version service.
  current:
  - api: Launchmetrics Search API
    version: v1
    base: https://nap.launchmetrics.com/search/v1
  - api: Launchmetrics Documents API
    version: v1
    base: https://nap.launchmetrics.com/documents/v1
  - api: Launchmetrics Documents v2 API
    version: v2
    base: https://nap.launchmetrics.com/documents/v2
  - api: Launchmetrics Medias API
    version: v1
    base: https://nap.launchmetrics.com/medias/v1
  - api: Launchmetrics Auditlogs API
    version: v1
    base: https://nap.launchmetrics.com/auditLogs/v1
  docs: https://nap.launchmetrics.com/docs
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  documented_deprecations:
  - item: appId / appid authentication parameter
    replacement: app_id
    source: https://nap.launchmetrics.com/docs/documents.html
    quote: The use of appId or appid is deprecated, use app_id instead
    sunset_date: null
  note: >-
    Launchmetrics publishes no deprecation policy, no sunset schedule and no RFC 8594 Sunset/Deprecation
    header support. The single deprecation notice above is an inline sentence in the Documents API
    reference with no date attached. Documents v1 is not marked deprecated even though v2 exists. No
    Deprecation pointer is emitted, because there is no policy to point at.
