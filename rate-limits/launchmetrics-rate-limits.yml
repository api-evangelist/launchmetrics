note: >-
  Launchmetrics publishes no rate limits for the NAP APIs. All five service pages (Search, Documents,
  Documents v2, Medias, Auditlogs) were read in full on 2026-08-17: the strings "rate limit",
  "throttle", "quota", "429", "Retry-After", "requests per" and "X-RateLimit" do not appear anywhere in
  the reference. The published error vocabulary contains no rate-limit-exceeded code — only
  MISSING_PARAMETERS (400) and INTERNAL_ERROR (500). Live unauthenticated GETs of the /ping health
  operations on search/v1, documents/v1 and medias/v1 returned 200 with no RateLimit-*, X-RateLimit-*
  or Retry-After response headers.
  An honest zero: an integrator has no published number to design against and no runtime signal to
  back off on. Any limiting that exists is enforced silently, or is set per app_id at provisioning
  time by Launchmetrics R&D and communicated out of band.
