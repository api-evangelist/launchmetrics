observability_note: >-
  The closest thing Launchmetrics publishes to a usage signal is GET /stats, documented on every
  service, which returns per-operation call counts, status-code breakdowns and latency statistics over
  the last 24 hours. That is a telemetry endpoint an integrator can poll, not a limit or a quota.
