note: >-
  Probed the RFC 8615 discovery surface on every Launchmetrics host reachable from apis.yml, the NAP
  API bases, and the hosts named inside the Discover single-page-app bundle. Two caveats that matter
  for reading the table below.
  (1) www/apex launchmetrics.com is behind a SiteGround bot challenge for our egress IP: every path
  returns HTTP 202 with an sg-captcha challenge redirect and a 169-200 byte HTML stub. Those are
  recorded as challenged, not as hits.
  (2) portal., discover. and discover-admin.launchmetrics.com are single-page apps whose catch-all
  route answers 200 with the same HTML shell for every /.well-known/* path. Those are recorded as
  spa-shell, not as hits — a 200 that returns an application shell is not a document.
  The only real document found on the whole surface is the RFC 9727 api-catalog on the careers
  subdomain, and its provenance is qualified below.
